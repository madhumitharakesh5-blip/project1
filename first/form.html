<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Event Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .card {
      border: none;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.9);
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px;
    }

    .form-control:focus, .form-select:focus {
      border-color: #764ba2;
      box-shadow: 0 0 5px rgba(118, 75, 162, 0.5);
    }

    .btn-custom {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-custom:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .title {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-lg p-4">
        <h3 class="text-center mb-4 title">🎓 Event Registration</h3>

        <form class="needs-validation" novalidate>

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" required>
            <div class="invalid-feedback">Please enter your name</div>
          </div>

          
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
            <div class="invalid-feedback">Enter a valid email</div>
          </div>

         
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" placeholder="10-digit number" pattern="[0-9]{10}" required>
            <div class="invalid-feedback">Enter valid phone number</div>
          </div>

      
          <div class="mb-3">
            <label class="form-label">Select Event</label>
            <select class="form-select" required>
              <option value="">Choose...</option>
              <option>Hackathon</option>
              <option>Workshop</option>
              <option>Tech Talk</option>
            </select>
            <div class="invalid-feedback">Please select an event</div>
          </div>

          
          <button class="btn btn-custom w-100">Register 🚀</button>

        </form>
      </div>

    </div>
  </div>
</div>


<script>
(() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')

  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
</script>

</body>
</html>
